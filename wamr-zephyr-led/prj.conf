# Heap Zephyr (k_malloc) - solo per il kernel, non per WAMR
CONFIG_HEAP_MEM_POOL_SIZE=16384

# Stack main - può tornare normale ora che WAMR ha il suo pool
CONFIG_MAIN_STACK_SIZE=4096

# Newlib - disabilita malloc arena, WAMR userà il suo pool statico
CONFIG_NEWLIB_LIBC=y
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=0

# Stack thread WASM (deve contenere il frame dell'interprete)
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

CONFIG_GPIO=y
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_UART_CONSOLE=y
CONFIG_CONSOLE=y
CONFIG_FILE_SYSTEM=y

# Ensure the compiler isn't optimizing out your large buffer
CONFIG_MAIN_STACK_SIZE=4096
