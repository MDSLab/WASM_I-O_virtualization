# ── micro-ROS ──────────────────────────────────────────────────────────────
CONFIG_MICROROS=y

# ── POSIX API (richiesto da micro-ROS) ─────────────────────────────────────
CONFIG_POSIX_API=y
CONFIG_PTHREAD_IPC=y

# ── Serial / UART ──────────────────────────────────────────────────────────
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y

# ── Stack & Heap ────────────────────────────────────────────────────────────
# L'F446RE ha 128 KB RAM: valori bilanciati ma sufficienti per il publisher
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=65536

# ── Clock di sistema ────────────────────────────────────────────────────────
CONFIG_SYS_CLOCK_HW_CYCLES_PER_SEC=84000000

# ── Newlib (richiesto da alcune dipendenze micro-ROS) ───────────────────────
CONFIG_NEWLIB_LIBC=y
CONFIG_NEWLIB_LIBC_FLOAT_PRINTF=y

# ── Logging (opzionale, utile per debug) ────────────────────────────────────
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
